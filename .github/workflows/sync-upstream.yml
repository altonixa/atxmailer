name: Sync from Upstream Mailflare

on:
  schedule:
    # Run every 6 hours to check for updates
    - cron: '0 */6 * * *'
  # Allow manual trigger from Actions tab
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/hieunc229/mailflare.git || true
          git remote set-url upstream https://github.com/hieunc229/mailflare.git

      - name: Fetch upstream changes
        run: git fetch upstream --all --tags

      - name: Push to atxmailer
        run: |
          git push origin --all --force
          git push origin --tags --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
